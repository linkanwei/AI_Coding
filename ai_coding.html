<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Vibe Coding to Future Software</title>
    <meta name="description" content="一小時學生簡報：AI 改變軟體工程的運作方式，但沒有改變確認責任。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b1220; }
        html, body { height: 100%; }
        body {
            font-family: "Noto Sans TC", Inter, sans-serif;
            background:
                radial-gradient(900px 420px at 0% -10%, rgba(34, 211, 238, .16), transparent 55%),
                radial-gradient(800px 380px at 100% 0%, rgba(59, 130, 246, .12), transparent 50%),
                var(--bg);
            color: #e2e8f0;
            overflow: hidden;
        }
        .slide { display: none; }
        .slide.active { display: flex; flex-direction: column; justify-content: center; min-height: 0; height: 100%; }
        .deck { height: calc(100vh - 4.25rem); }
        body.notes-on .deck { height: calc(100vh - 4.25rem - 9.5rem); }
        .glass { background: rgba(15, 23, 42, .78); border: 1px solid rgba(148, 163, 184, .18); }
        .kicker { letter-spacing: .14em; text-transform: uppercase; }
        .flow { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: .4rem; }
        .flow-step { min-height: 5.4rem; display: flex; align-items: center; justify-content: center; text-align: center; }
        .gate { border-bottom: 4px solid #22d3ee; }
        #notes { height: 9.5rem; }
        .theme-choice[aria-pressed="true"] { background: #22d3ee; color: #0f172a; }
        body[data-theme="white"] { --bg: #fff; background: #fff; color: #0f172a; }
        body[data-theme="gray"] { --bg: #d8dce3; background: #d8dce3; color: #0f172a; }
        body[data-theme="white"] .text-white, body[data-theme="gray"] .text-white { color: #0f172a; }
        body[data-theme="white"] .text-slate-100, body[data-theme="white"] .text-slate-200,
        body[data-theme="gray"] .text-slate-100, body[data-theme="gray"] .text-slate-200 { color: #1e293b; }
        body[data-theme="white"] .text-slate-300, body[data-theme="gray"] .text-slate-300 { color: #334155; }
        body[data-theme="white"] .text-slate-400, body[data-theme="gray"] .text-slate-400 { color: #475569; }
        body[data-theme="white"] .text-cyan-100, body[data-theme="white"] .text-cyan-200, body[data-theme="white"] .text-cyan-300,
        body[data-theme="gray"] .text-cyan-100, body[data-theme="gray"] .text-cyan-200, body[data-theme="gray"] .text-cyan-300 { color: #0e7490; }
        body[data-theme="white"] header, body[data-theme="white"] #notes { background: rgba(255,255,255,.94); border-color: rgba(15,23,42,.12); }
        body[data-theme="gray"] header, body[data-theme="gray"] #notes { background: rgba(216,220,227,.95); border-color: rgba(15,23,42,.12); }
        body[data-theme="white"] .glass, body[data-theme="gray"] .glass { background: rgba(255,255,255,.72); border-color: rgba(15,23,42,.12); }
        body[data-theme="white"] .border-white\/10, body[data-theme="gray"] .border-white\/10 { border-color: rgba(15,23,42,.14); }
        body[data-theme="white"] .bg-white\/5, body[data-theme="gray"] .bg-white\/5 { background: rgba(15,23,42,.08); }
        body[data-theme="white"] #indicator, body[data-theme="gray"] #indicator { color:#0e7490; background:rgba(8,145,178,.1); border-color:rgba(8,145,178,.35); }
        body.presentation-mode header {
            position: fixed;
            z-index: 30;
            top: .75rem;
            right: .75rem;
            width: auto;
            height: auto;
            padding: 0;
            border: 0;
            background: transparent;
            backdrop-filter: none;
        }
        body.presentation-mode #title-block,
        body.presentation-mode #theme-switch,
        body.presentation-mode #notes-btn { display: none; }
        body.presentation-mode header > div:last-child { opacity: .22; transition: opacity .2s ease; }
        body.presentation-mode header > div:last-child:hover,
        body.presentation-mode header > div:last-child:focus-within { opacity: 1; }
        body.presentation-mode #progress-track { position: fixed; z-index: 40; inset: 0 0 auto; }
        body.presentation-mode .deck { width: 100%; max-width: none; height: 100vh; padding-left: clamp(2rem, 8vw, 9rem); padding-right: clamp(2rem, 8vw, 9rem); }
        body.presentation-mode #notes { display: none !important; }
        /* 教室投影：後排要能讀。字級跟視窗高度走，1080p 用大字，較矮的畫面略收。 */
        @media (min-width: 1000px) {
            .slide {
                --fs: 26px;
                --fs-xs: 18px;
                --fs-sm: 22px;
                --fs-base: 24px;
                --fs-lg: 26px;
                --fs-xl: 30px;
                --fs-2xl: 36px;
                --fs-h: 48px;
                --fs-h1: 64px;
                font-size: var(--fs);
                font-weight: 500;
                line-height: 1.4;
            }
        }
        @media (min-width: 1000px) and (min-height: 900px) {
            .slide {
                --fs: 32px;
                --fs-xs: 22px;
                --fs-sm: 26px;
                --fs-base: 30px;
                --fs-lg: 32px;
                --fs-xl: 36px;
                --fs-2xl: 44px;
                --fs-h: 60px;
                --fs-h1: 80px;
            }
        }
        @media (min-width: 1000px) {
            body:not(.presentation-mode) .deck { max-width: min(1680px, 96vw) !important; }
            .slide h1 { font-size: var(--fs-h1) !important; line-height: 1.12 !important; max-width: none !important; }
            .slide h2 { font-size: var(--fs-h) !important; line-height: 1.16 !important; max-width: none !important; }
            .slide .text-xs { font-size: var(--fs-xs) !important; line-height: 1.4 !important; }
            .slide .text-sm { font-size: var(--fs-sm) !important; line-height: 1.4 !important; }
            .slide .text-base { font-size: var(--fs-base) !important; line-height: 1.4 !important; }
            .slide .text-lg { font-size: var(--fs-lg) !important; line-height: 1.4 !important; }
            .slide .text-xl { font-size: var(--fs-xl) !important; line-height: 1.35 !important; }
            .slide .text-2xl,
            .slide .sm\:text-2xl { font-size: var(--fs-2xl) !important; line-height: 1.3 !important; }
            .slide .leading-relaxed,
            .slide .leading-tight { line-height: 1.4 !important; }
            .slide h1.leading-tight,
            .slide h2.leading-tight { line-height: 1.15 !important; }
            .slide small { font-size: .85em; }
            .slide .max-w-4xl,
            .slide .max-w-5xl { max-width: 100% !important; }
            .slide .mt-8 { margin-top: 1.15rem !important; }
            .slide .mt-7 { margin-top: 1rem !important; }
            .slide .mt-6 { margin-top: .85rem !important; }
            .slide .mt-5 { margin-top: .65rem !important; }
            .slide .p-6 { padding: 1.1rem !important; }
            .slide .p-5 { padding: .95rem !important; }
            .slide .flow-step { min-height: 4.6rem; }
        }
        @media (max-width: 800px) {
            body { overflow: auto; }
            .deck { height: auto; min-height: calc(100vh - 4.25rem); }
            body.notes-on .deck { height: auto; }
            .slide.active { min-height: calc(100vh - 4.25rem); height: auto; padding: 2rem 0; }
            .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            body.presentation-mode { overflow: auto; }
            body.presentation-mode .deck { height: auto; min-height: 100vh; padding-left: 1rem; padding-right: 1rem; }
            body.presentation-mode .slide.active { min-height: 100vh; }
        }
    </style>
</head>
<body class="selection:bg-cyan-400 selection:text-slate-950">
    <header class="flex h-[4.25rem] items-center justify-between gap-3 border-b border-white/10 bg-slate-950/80 px-4 backdrop-blur sm:px-6">
        <div id="title-block" class="min-w-0">
            <p class="truncate text-sm font-black text-white sm:text-base">From Vibe Coding to Future Software</p>
            <p class="truncate text-xs text-cyan-300">AI 改變運作方式；確認責任沒有改變</p>
        </div>
        <div class="flex shrink-0 items-center gap-2">
            <div id="theme-switch" class="flex rounded-lg border border-white/10 p-0.5" role="group" aria-label="底色">
                <button type="button" data-theme-choice="white" class="theme-choice rounded-md px-2 py-1 text-xs font-bold text-slate-200">白</button>
                <button type="button" data-theme-choice="gray" class="theme-choice rounded-md px-2 py-1 text-xs font-bold text-slate-200">灰</button>
                <button type="button" data-theme-choice="black" class="theme-choice rounded-md px-2 py-1 text-xs font-bold text-slate-200">黑</button>
            </div>
            <span id="indicator" class="rounded-full border border-cyan-400/30 bg-cyan-400/10 px-3 py-1 text-xs font-bold text-cyan-100"></span>
            <button id="notes-btn" type="button" class="rounded-lg border border-white/10 px-3 py-2 text-xs font-semibold text-slate-200" aria-pressed="false">備註 N</button>
            <button id="fullscreen-btn" type="button" class="grid h-9 w-9 place-items-center rounded-lg border border-white/10 text-slate-200" aria-label="全螢幕播放" title="全螢幕播放（F）"><i class="fa-solid fa-expand"></i></button>
            <button id="prev-btn" class="grid h-9 w-9 place-items-center rounded-lg border border-white/10 text-slate-200" aria-label="上一張"><i class="fa-solid fa-arrow-left"></i></button>
            <button id="next-btn" class="grid h-9 w-9 place-items-center rounded-lg bg-cyan-400 text-slate-950" aria-label="下一張"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </header>
    <div id="progress-track" class="h-1 bg-white/5"><div id="bar" class="h-full bg-cyan-400 transition-all"></div></div>
    <main class="deck mx-auto w-full max-w-6xl px-4 sm:px-8" id="deck"></main>
    <aside id="notes" class="hidden border-t border-cyan-400/20 bg-slate-950/95 px-4 py-3 sm:px-8" aria-live="polite">
        <p class="text-xs font-bold tracking-widest text-cyan-300">講者備註</p>
        <p id="note-text" class="mt-1 text-sm leading-relaxed text-slate-200 sm:text-base"></p>
    </aside>

    <script>
        // ── 投影片用的 SVG 圖：顏色一律 currentColor，跟著白／灰／黑底色切換 ──
        const D = (() => {
            const fz = n => (Number(n) * 1.22).toFixed(1);
            const svg = (w, h, inner, label, maxh = "42vh") =>
                `<svg viewBox="0 0 ${w} ${h}" class="mx-auto mt-4 block h-auto w-full" style="max-height:${maxh}" role="img" aria-label="${label}">${inner}</svg>`;
            const box = (x, y, w, h, t, s = "", tone = "text-white", strong = false) =>
                `<g class="${tone}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="currentColor" fill-opacity="${strong ? .16 : .05}" stroke="currentColor" stroke-opacity="${strong ? .95 : .45}" stroke-width="${strong ? 2.4 : 1.4}"/>` +
                `<text x="${x + w / 2}" y="${y + h / 2 + (s ? -6 : 6)}" text-anchor="middle" font-size="${fz(15)}" font-weight="800" fill="currentColor">${t}</text>` +
                (s ? `<text x="${x + w / 2}" y="${y + h / 2 + 18}" text-anchor="middle" font-size="${fz(11.5)}" fill="currentColor" fill-opacity=".75">${s}</text>` : "") + `</g>`;
            const head = (x, y, a, L = 10) => {
                const p = d => `${(x - L * Math.cos(a + d)).toFixed(1)},${(y - L * Math.sin(a + d)).toFixed(1)}`;
                return `<polygon points="${x},${y} ${p(-.45)} ${p(.45)}" fill="currentColor"/>`;
            };
            const arrow = (x1, y1, x2, y2, label = "", tone = "text-cyan-300", dash = false, ly = -8) =>
                `<g class="${tone}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="2" ${dash ? 'stroke-dasharray="6 5"' : ""}/>${head(x2, y2, Math.atan2(y2 - y1, x2 - x1))}` +
                (label ? (Math.abs(x2 - x1) < 2
                    // 垂直箭頭：標籤放右側，不壓在線上
                    ? `<text x="${x1 + 8}" y="${(y1 + y2) / 2 + 4}" text-anchor="start" font-size="${fz(12)}" font-weight="700" fill="currentColor">${label}</text>`
                    : `<text x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 + ly}" text-anchor="middle" font-size="${fz(12)}" font-weight="700" fill="currentColor">${label}</text>`) : "") + `</g>`;
            const text = (x, y, t, size = 12, tone = "text-slate-300", anchor = "middle", weight = 500) =>
                `<text class="${tone}" x="${x}" y="${y}" text-anchor="${anchor}" font-size="${fz(size)}" font-weight="${weight}" fill="currentColor">${t}</text>`;
            // 由下方繞回去的回饋箭頭（迴圈）
            const back = (x1, x2, y, depth, label, tone = "text-cyan-300") =>
                `<g class="${tone}"><path d="M ${x1} ${y} C ${x1} ${y + depth}, ${x2} ${y + depth}, ${x2} ${y + 4}" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5"/>${head(x2, y, -Math.PI / 2)}` +
                `<text x="${(x1 + x2) / 2}" y="${y + depth * .75 + 22}" text-anchor="middle" font-size="${fz(12.5)}" font-weight="700" fill="currentColor">${label}</text></g>`;
            // 一列方框＋箭頭；loop 有值時畫回饋箭頭
            const chain = (items, { w = 900, bw = 150, bh = 60, y = 30, loop = "", strong = [], label = "流程" } = {}) => {
                const gap = (w - 40 - bw * items.length) / (items.length - 1);
                let g = "";
                items.forEach((it, i) => {
                    const x = 20 + i * (bw + gap);
                    g += box(x, y, bw, bh, it[0], it[1] || "", strong.includes(i) ? "text-cyan-300" : "text-white", strong.includes(i));
                    if (i < items.length - 1) g += arrow(x + bw + 4, y + bh / 2, x + bw + gap - 4, y + bh / 2);
                });
                if (loop) g += back(20 + (items.length - 1) * (bw + gap) + bw / 2, 20 + bw / 2, y + bh, 70, loop);
                return svg(w, y + bh + (loop ? 85 : 20), g, label);
            };
            // 中心＋周圍的輪輻圖（Harness）
            const hub = (center, items, label) => {
                const cx = 450, cy = 190, pos = [[375, 18], [95, 70], [655, 70], [40, 168], [710, 168], [125, 282], [625, 282]];
                let g = `<g class="text-slate-400"><rect x="8" y="6" width="884" height="356" rx="22" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-dasharray="7 6"/></g>` +
                    text(26, 30, "HARNESS", 12, "text-cyan-300", "start", 800);
                items.forEach((it, i) => {
                    const [x, y] = pos[i];
                    const bw = i === 6 ? 196 : 150;
                    g += `<g class="text-slate-400"><line x1="${cx}" y1="${cy}" x2="${x + bw / 2}" y2="${y + 28}" stroke="currentColor" stroke-opacity=".55" stroke-width="1.4"/></g>`;
                    g += box(x, y, bw, 56, it[0], it[1]);
                });
                g += `<g class="text-cyan-300"><circle cx="${cx}" cy="${cy}" r="62" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="2.4"/>` +
                    `<text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="${fz(17)}" font-weight="900" fill="currentColor">${center[0]}</text>` +
                    `<text x="${cx}" y="${cy + 18}" text-anchor="middle" font-size="${fz(11.5)}" fill="currentColor">${center[1]}</text></g>`;
                return svg(900, 368, g, label, "44vh");
            };
            return { svg, box, arrow, text, back, chain, hub, head };
        })();

        const slidesData = [
            {
                kicker: "一小時",
                title: "From Vibe Coding<br>to Future Software",
                body: `<p class="mt-6 max-w-4xl text-xl leading-relaxed text-slate-300 sm:text-2xl">需求 → 規格 → SA → SD → 開發 → Review → Test → Deploy → Test → PDCA。<br>AI 讓每一步變快，但沒有替任何人簽收。</p>`,
                note: "開場就先把完整流程念出來。今天不是反對 AI，而是把 AI 放回軟體工程。全場只有一句主張：運作方式改變了，確認責任沒有改變。"
            },
            {
                kicker: "今天怎麼走",
                title: "從感覺，走到可交付的軟體",
                body: `<div class="mt-6 grid gap-3 md:grid-cols-3">
                    <div class="glass rounded-2xl p-4"><b class="text-cyan-300">01</b><p class="mt-2 text-lg font-black text-white">Vibe Coding</p><p class="mt-1 text-sm text-slate-300">為什麼突然做得到</p></div>
                    <div class="glass rounded-2xl p-4"><b class="text-cyan-300">02</b><p class="mt-2 text-lg font-black text-white">Software Engineering</p><p class="mt-1 text-sm text-slate-300">流程與確認為何仍在</p></div>
                    <div class="glass rounded-2xl p-4"><b class="text-cyan-300">03</b><p class="mt-2 text-lg font-black text-white">AI Coding Harness</p><p class="mt-1 text-sm text-slate-300">Tools、Rules、Skills、Gates</p></div>
                    <div class="glass rounded-2xl p-4"><b class="text-cyan-300">04</b><p class="mt-2 text-lg font-black text-white">FDE 經驗</p><p class="mt-1 text-sm text-slate-300">帶 Junior 從訪談到安裝</p></div>
                    <div class="glass rounded-2xl p-4"><b class="text-cyan-300">05</b><p class="mt-2 text-lg font-black text-white">真實導入</p><p class="mt-1 text-sm text-slate-300">企業 AI Data Mart，從規格到客戶上線</p></div>
                    <div class="glass rounded-2xl p-4 ring-1 ring-cyan-400/50"><b class="text-cyan-300">06</b><p class="mt-2 text-lg font-black text-white">這份簡報</p><p class="mt-1 text-sm text-slate-300">Cursor 換模型，再用 Claude Code 調整</p></div>
                </div>`,
                note: "先交代路線。前五段是課：現象、流程、Harness、帶 Junior、以及一個正在客戶端運作的專案。最後一段用這份簡報自己當案例：同一份 ai_coding.html，Cursor 裡從 Grok 4.7 換到 GPT 5.6，再交給 Claude Code 調整。用來說明為什麼不能只留一個工具。"
            },
            {
                kicker: "起點 · 2025 年 2 月 3 日",
                title: "Vibe Coding：原文與中譯",
                body: `<div class="mt-4 grid min-h-0 gap-5 md:grid-cols-[.9fr_1.1fr]">
                    <a href="https://x.com/karpathy/status/1886192184808149383" target="_blank" rel="noopener noreferrer"><img src="images/karpathy-vibe-coding.png" alt="Karpathy 提出 vibe coding 的貼文截圖" class="mx-auto max-h-[58vh] w-auto rounded-2xl bg-white shadow-xl"></a>
                    <div class="glass rounded-2xl p-5 text-sm leading-relaxed text-slate-200 sm:text-base">
                        <p><b class="text-cyan-300">有一種新的寫程式方式，我叫它 vibe coding。</b>完全跟著感覺走，擁抱指數成長，甚至忘掉程式碼存在；LLM 已經強得過頭。</p>
                        <p class="mt-3">我幾乎不碰鍵盤；一律 Accept All，不讀 diff。錯誤訊息一句話不加、整段貼回去，通常就好了。</p>
                        <p class="mt-3">程式大到超出我理解。修不好就繞過去，或隨便改到它消失。拿來做週末會丟掉的專案還不錯：我只是看、說、跑、貼上，然後它大致能動。</p>
                    </div>
                </div>`,
                note: "截圖與中譯同頁。先看左邊原文，再讀右邊三段。重點不是嘲笑 Accept All，而是指出 Karpathy 自己限定了場景：throwaway weekend project。『大致能動』不是正式軟體的完成定義。"
            },
            {
                kicker: "為什麼會出現",
                title: "工具先跨過線，習慣跟著改",
                body: `<div class="mt-7 grid gap-4 md:grid-cols-3">
                    <div class="glass rounded-2xl p-5"><b class="text-cyan-300">能力</b><p class="mt-2 text-lg text-white">模型能改整個功能，不只補下一行</p></div>
                    <div class="glass rounded-2xl p-5"><b class="text-cyan-300">成本</b><p class="mt-2 text-lg text-white">說一句話，比自己找檔案便宜</p></div>
                    <div class="glass rounded-2xl p-5"><b class="text-cyan-300">標準</b><p class="mt-2 text-lg text-white">原型只要「大致能動」</p></div>
                </div><p class="mt-5 text-lg text-slate-300">問題不是原型快；是把原型的完成標準帶進正式軟體。</p>`,
                note: "變化不是人突然變懶。模型能力、互動成本與原型場景一起跨過臨界點。真正的錯誤是沒有在場景改變時切換品質標準。"
            },
            {
                kicker: "一年後 · 2026",
                title: "Agentic Engineering：原文與中譯",
                body: `<div class="mt-4 grid min-h-0 gap-5 md:grid-cols-[.9fr_1.1fr]">

        const deck = document.getElementById("deck");
        deck.innerHTML = slidesData.map((slide, i) => `
            <section class="slide ${i===0?"active":""}" data-slide="${i+1}">
                <p class="kicker text-xs font-bold text-cyan-300">${slide.kicker}</p>
                <h${i===0?"1":"2"} class="mt-3 max-w-5xl text-3xl font-black leading-tight text-white sm:text-5xl ${i===0?"lg:text-7xl":""}">${slide.title}</h${i===0?"1":"2"}>
                ${slide.body}
                <p class="speaker-note" hidden>${slide.note}</p>
            </section>`).join("");

        const slides = [...document.querySelectorAll(".slide")];
        const total = slides.length;
        let index = Math.max(0, Math.min(slides.length - 1, Number(new URLSearchParams(location.search).get("slide") || 1) - 1));
        let notesOn = false;
        const indicator = document.getElementById("indicator");
        const bar = document.getElementById("bar");
        const notes = document.getElementById("notes");
        const noteText = document.getElementById("note-text");
        const notesBtn = document.getElementById("notes-btn");
        const fullscreenBtn = document.getElementById("fullscreen-btn");

        function render() {
            slides.forEach((slide, i) => slide.classList.toggle("active", i === index));
            indicator.textContent = `${index + 1} / ${total}`;
            bar.style.width = `${((index + 1) / total) * 100}%`;
            const note = slides[index].querySelector(".speaker-note");
            noteText.textContent = note ? note.textContent.trim() : "";
            notes.classList.toggle("hidden", !notesOn);
            document.body.classList.toggle("notes-on", notesOn);
            notesBtn.setAttribute("aria-pressed", String(notesOn));
        }
        function go(next) { index = Math.max(0, Math.min(total - 1, next)); render(); }
        function toggleNotes() { notesOn = !notesOn; render(); }
        function syncPresentationMode(on) {
            document.body.classList.toggle("presentation-mode", on);
            fullscreenBtn.setAttribute("aria-label", on ? "離開全螢幕播放" : "全螢幕播放");
            fullscreenBtn.setAttribute("title", on ? "離開全螢幕播放（F 或 Esc）" : "全螢幕播放（F）");
            fullscreenBtn.querySelector("i").className = `fa-solid ${on ? "fa-compress" : "fa-expand"}`;
        }
        async function togglePresentation() {
            const entering = !document.body.classList.contains("presentation-mode");
            if (entering) {
                notesOn = false;
                render();
                syncPresentationMode(true);
                try { await document.documentElement.requestFullscreen?.(); } catch {}
            } else {
                syncPresentationMode(false);
                try { if (document.fullscreenElement) await document.exitFullscreen(); } catch {}
            }
        }

        const themes = ["white", "gray", "black"];
        function applyTheme(theme) {
            if (!themes.includes(theme)) theme = "black";
            document.body.dataset.theme = theme;
            document.querySelectorAll("[data-theme-choice]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.themeChoice === theme)));
            try { localStorage.setItem("ai-coding-theme", theme); } catch {}
        }
        document.getElementById("theme-switch").addEventListener("click", e => {
            const choice = e.target.closest("[data-theme-choice]");
            if (choice) applyTheme(choice.dataset.themeChoice);
        });
        document.getElementById("next-btn").addEventListener("click", () => go(index + 1));
        document.getElementById("prev-btn").addEventListener("click", () => go(index - 1));
        notesBtn.addEventListener("click", toggleNotes);
        fullscreenBtn.addEventListener("click", togglePresentation);
        document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement) syncPresentationMode(false);
        });
        document.addEventListener("keydown", event => {
            if (["INPUT","TEXTAREA"].includes(event.target?.tagName)) return;
            if (event.key.toLowerCase() === "n") { event.preventDefault(); toggleNotes(); return; }
            if (event.key.toLowerCase() === "f") { event.preventDefault(); togglePresentation(); return; }
            if (event.key.toLowerCase() === "t") {
                event.preventDefault();
                const current = document.body.dataset.theme || "black";
                applyTheme(themes[(themes.indexOf(current) + 1) % themes.length]);
                return;
            }
            if (["ArrowRight"," ","PageDown"].includes(event.key)) { event.preventDefault(); go(index + 1); }
            else if (["ArrowLeft","PageUp"].includes(event.key)) { event.preventDefault(); go(index - 1); }
            else if (event.key === "Home") { event.preventDefault(); go(0); }
            else if (event.key === "End") { event.preventDefault(); go(total - 1); }
        });
        applyTheme(localStorage.getItem("ai-coding-theme") || "black");
        if (new URLSearchParams(location.search).get("present") === "1") syncPresentationMode(true);
        render();
    </script>
